name: Build IPA

# Compiles PuenteWiFi on a GitHub-hosted Mac and uploads an UNSIGNED .ipa.
# You then sign and install it on your iPhone with Sideloadly or AltStore + your Apple ID.
# No Xcode needed on your own Mac.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project PuenteWiFi.xcodeproj \
            -scheme PuenteWiFi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PuenteWiFi.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || xcodebuild archive \
            -project PuenteWiFi.xcodeproj \
            -scheme PuenteWiFi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PuenteWiFi.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          cd build/PuenteWiFi.xcarchive/Products/Applications
          mkdir -p Payload
          mv PuenteWiFi.app Payload/
          zip -qry "$GITHUB_WORKSPACE/PuenteWiFi-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PuenteWiFi-unsigned-ipa
          path: PuenteWiFi-unsigned.ipa
          if-no-files-found: error
