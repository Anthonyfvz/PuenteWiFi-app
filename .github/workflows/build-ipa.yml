name: Build IPA

# Compiles PuenteWiFi on a GitHub-hosted Mac and uploads an UNSIGNED .ipa.
# You then sign and install it on your iPhone with Sideloadly or AltStore + your Apple ID.
# No Xcode needed on your own Mac.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PuenteWiFi.xcodeproj \
            -scheme PuenteWiFi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PuenteWiFi.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          archive="$PWD/build/PuenteWiFi.xcarchive"
          echo "Contenido del archivo:"
          ls -R "$archive/Products" || true
          app="$(find "$archive" -maxdepth 4 -name '*.app' -type d | head -1)"
          if [ -z "$app" ]; then
            echo "No se encontró ninguna .app dentro del archivo"; exit 1
          fi
          echo "App encontrada: $app"
          rm -rf "$PWD/build/Payload"
          mkdir -p "$PWD/build/Payload"
          cp -R "$app" "$PWD/build/Payload/"
          ( cd "$PWD/build" && zip -qry "$GITHUB_WORKSPACE/PuenteWiFi-unsigned.ipa" Payload )
          echo "IPA creada:"
          ls -la "$GITHUB_WORKSPACE/PuenteWiFi-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PuenteWiFi-unsigned-ipa
          path: PuenteWiFi-unsigned.ipa
          if-no-files-found: error
